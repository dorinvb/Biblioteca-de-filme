<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca de Filme</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vibrant.js/1.0.0/Vibrant.min.js"></script>
</head>
<body>

<!-- HEADER -->
<header id="main-header">
    <div class="header-left">
        <div class="logo-owl" onclick="goHome()" title="Acasă">
            <svg width="42" height="42" viewBox="0 0 55 55" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="27.5" cy="30" r="14" fill="#CC5500" opacity="0.9"/>
                <circle cx="27.5" cy="20" r="10" fill="#FF8C00"/>
                <circle cx="21" cy="20" r="4" fill="white" stroke="#f5c518" stroke-width="1.5"/>
                <circle cx="34" cy="20" r="4" fill="white" stroke="#f5c518" stroke-width="1.5"/>
                <line x1="25" y1="20" x2="30" y2="20" stroke="#f5c518" stroke-width="1.5"/>
                <circle cx="21" cy="20" r="1.5" fill="black"/>
                <circle cx="34" cy="20" r="1.5" fill="black"/>
                <path d="M27.5 24 L30 27 L25 27 L27.5 24" fill="#f5c518"/>
                <rect x="15" y="37" width="25" height="5" rx="2" fill="#f5c518" opacity="0.9"/>
                <circle cx="18" cy="39.5" r="1.5" fill="#121212"/>
                <circle cx="23" cy="39.5" r="1.5" fill="#121212"/>
                <circle cx="28" cy="39.5" r="1.5" fill="#121212"/>
                <circle cx="33" cy="39.5" r="1.5" fill="#121212"/>
                <circle cx="38" cy="39.5" r="1.5" fill="#121212"/>
            </svg>
        </div>
        <button class="home-btn" onclick="goHome()">
            <i class="fas fa-home"></i>
            <span>HOME</span>
        </button>
    </div>

    <div class="header-title">BIBLIOTECA DE FILME</div>

    <div class="header-right">
        <div class="dropdown-group">
            <span class="dropdown-label">ANUL</span>
            <select id="year-select" onchange="handleYearChange()">
                <option value="">Selectează</option>
            </select>
        </div>
        <div class="dropdown-group">
            <span class="dropdown-label">PREMII</span>
            <select id="fest-select" onchange="handleFestChange()">
                <option value="">Selectează</option>
                <option value="oscar">🏆 OSCAR</option>
                <option value="globuldeaur">🌍 GLOBUL DE AUR</option>
                <option value="bafta">🎭 BAFTA</option>
                <option value="cannes">🌴 CANNES</option>
                <option value="berlin">🐻 BERLIN</option>
                <option value="venetia">🦁 VENEȚIA</option>
                <option value="sundance">🏔️ SUNDANCE</option>
                <option value="gopo">🎬 GOPO</option>
                <option value="tiff">🎪 TIFF</option>
            </select>
        </div>
    </div>
</header>

<!-- MAIN VIEWPORT -->
<main id="app-viewport"></main>

<!-- OVERLAY FILM (z-index: 2000) -->
<div id="film-overlay" class="overlay" style="display:none">
    <div id="film-overlay-content" class="overlay-content"></div>
</div>

<!-- OVERLAY ACTOR (z-index: 3000) -->
<div id="actor-overlay" class="overlay overlay-actor" style="display:none">
    <div id="actor-overlay-content" class="overlay-content"></div>
</div>

<!-- SCRIPTS — ORDINEA CONTEAZĂ -->
<script src="database/map.js"></script>
<script src="script.js"></script>
</body>
</html>
